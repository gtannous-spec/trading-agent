services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: trader-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_dev
      POSTGRES_DB: trader_agent
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trader_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
