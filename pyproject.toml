[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trader-agent"
version = "0.1.0"
description = "Multi-modal quantitative trading agent -- predicts stock movement probability using fundamentals, insider trades, news, and social sentiment."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "tenacity>=8.3",

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",

    # Data / ML
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "joblib>=1.4",

    # NLP
    "transformers>=4.40",
    "torch>=2.3",
    "vaderSentiment>=3.3",

    # Data sources
    "yfinance>=0.2",

    # CLI / display
    "rich>=13.7",

    # Scheduling
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "ipython>=8.24",
]

[project.scripts]
trader-ingest = "trader_agent.ingestion.scheduler:start_scheduler"
trader-analyze = "trader_agent.cli:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (catch stray prints)
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["trader_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require a live database",
]

[tool.coverage.run]
source = ["trader_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

[tool.hatch.build.targets.wheel]
packages = ["src/trader_agent"]
